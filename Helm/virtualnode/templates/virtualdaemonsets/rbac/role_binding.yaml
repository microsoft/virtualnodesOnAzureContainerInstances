{{- if and .Values.rbac.install .Values.virtualdaemonsetControllerManager.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "virtualnode2.labels" . | nindent 4 }}
  name: virtualdaemonsets-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: virtualdaemonsets-manager-role
subjects:
- kind: ServiceAccount
  name: {{ .Values.virtualdaemonsetControllerManager.serviceAccountName }}
  namespace: {{ include "virtualnode2.namespace" . }}
{{- end -}}
