{{- if .Values.rbac.install }}
apiVersion: "rbac.authorization.k8s.io/{{ .Values.rbac.apiVersion }}"
kind: ClusterRoleBinding
metadata:
  name: {{ include "virtualnode2.fullname" . }}-node-proxier
  labels:
    {{- include "virtualnode2.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rbac.kubeProxyServiceAccountName }}
    namespace: {{ include "virtualnode2.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:node-proxier
---
apiVersion: "rbac.authorization.k8s.io/{{ .Values.rbac.apiVersion }}"
kind: Role
metadata:
  name: {{ include "virtualnode2.fullname" . }}-kube-proxy-token
  namespace: {{ include "virtualnode2.namespace" . }}
  labels:
    {{- include "virtualnode2.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: [{{ .Values.rbac.kubeProxyServiceAccountName | quote }}]
    verbs: ["create"]
---
apiVersion: "rbac.authorization.k8s.io/{{ .Values.rbac.apiVersion }}"
kind: RoleBinding
metadata:
  name: {{ include "virtualnode2.fullname" . }}-kube-proxy-token
  namespace: {{ include "virtualnode2.namespace" . }}
  labels:
    {{- include "virtualnode2.labels" . | nindent 4 }}
subjects:
  {{- include "virtualnode2.infraServiceAccountSubject" . | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "virtualnode2.fullname" . }}-kube-proxy-token
{{- end }}
